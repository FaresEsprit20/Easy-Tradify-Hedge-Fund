<div class="chart">
  <canvas #canvas class="chart__canvas" aria-hidden="true"></canvas>

  <!--
    Labelled as a simulation, visibly and permanently. This is decorative
    synthetic data, and an unlabelled chart on a trading product's front door
    is the kind of thing that gets screenshotted and mistaken for performance.
  -->
  <div class="chart__tag">
    <span class="chart__dot"></span>
    SIMULATED FEED
  </div>
</div>
