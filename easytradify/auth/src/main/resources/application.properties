spring.application.name=auth-service

# 8093.
#
# This project reserves 8080 gateway, 8083 portfolio, 8084 ai, 8085 trades,
# 8086 execution, 8087 monitor, 8761 discovery. 8089 would have been the
# obvious next one and is NOT safe here: another Spring project on this machine
# runs a recaptcha-service there, and it also holds 8081, 8082, 8088 and 8090.
# Two apps on one port means whichever starts second dies, so the gap is
# deliberate rather than tidy.
server.port=8093

# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/easytradify-auth-service
# Defaults match the other modules in this project so the service starts on a
# developer machine without extra setup; both are overridable from .env or the
# environment, which is how anything but localhost should supply them.
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# `update` creates and extends tables but never drops a column, so a field
# removed from an entity leaves its data behind rather than destroying it.
# It is the right setting while this schema is still moving and the wrong one
# for a deployed service -- use a migration tool before this holds real accounts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ============================================================
# GOOGLE OAUTH2
# ============================================================
# Credentials come from .env (git-ignored), loaded by DotenvInitializer.
# They are NOT defaulted: an empty client id produces a confusing redirect
# failure at Google rather than a clear startup error, so leaving these unset
# and letting the placeholder show up in logs is the lesser evil.
#
# The defaults are deliberately non-empty placeholders rather than "". Spring
# Boot REFUSES TO START if a registration's client id is empty, which would
# make the entire service -- password sign-in, 2FA, account management, all of
# it -- unavailable to anyone who has not yet obtained Google credentials.
# With a placeholder the service boots, everything else works, and only the
# Google handshake fails, with a message naming the variable to set.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:SET_GOOGLE_CLIENT_ID_IN_DOT_ENV}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:SET_GOOGLE_CLIENT_SECRET_IN_DOT_ENV}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Must match a redirect URI registered in the Google Cloud console EXACTLY,
# including scheme, host, port and path. Google rejects anything else outright.
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ============================================================
# APP
# ============================================================
# Where the browser lands after a successful OAuth2 handshake. The Angular app
# reads the tokens off the query string here; the same tokens are also set as
# httpOnly cookies, which is what every later request actually authenticates with.
app.oauth2.success-url=http://localhost:4200/auth/oauth2/success

# ============================================================
# SECURITY
# ============================================================
# Salt for the IP and User-Agent hashes stored against each token.
#
# Those hashes let a token be tied to the client that obtained it without
# keeping the raw IP, which is personal data. The salt is what stops the hash
# being reversible: an unsalted SHA of an IPv4 address is trivially brute-forced
# (there are only ~4 billion of them, seconds of work), so an unsalted column
# would be a plaintext IP log wearing a disguise.
#
# MUST be overridden per environment. Changing it invalidates every stored hash,
# which logs everyone out — an acceptable cost, and the reason it is not rotated
# casually.
application.security.ip-salt=${IP_SALT:easytradify-local-dev-salt-change-me}

# Comma-separated proxies whose X-Forwarded-For header may be believed. Empty
# means trust none and use the socket address, which is the safe default: any
# client can send X-Forwarded-For, so honouring it unconditionally lets a caller
# choose the IP their rate limit is counted against.
application.security.trusted-proxies=${TRUSTED_PROXIES:}

# Shared secret for the /internal/** endpoints, sent as X-API-Key. Those routes
# are not exposed through the gateway; this is the second line of defence if one
# ever is.
internal.api.key=${INTERNAL_API_KEY:}

# ============================================================
# OUTBOUND
# ============================================================
# Where the password-reset email points the user. Must be a page the ANGULAR app
# serves, not this service: the link goes to a human in a mail client, and the
# token in it is consumed by the form on that page.
app.reset-url=${APP_RESET_URL:http://localhost:4200/auth/reset-password}

# Mail and reCAPTCHA senders.
#
# Neither is a module of THIS project. They belong to the codebase this auth
# stack was ported from, and both happen to be running on this machine and
# registered with the same Eureka (mailing-service:8085, recaptcha-service:8089),
# so the defaults point at them and password reset / captcha work as they did
# originally.
#
# Treat that as borrowed, not owned. If those services stop, password reset and
# the captcha check fail at CALL time rather than at startup, and the rest of
# the auth surface — sign-in, two-factor, account management — keeps working.
# Standing up this project's own senders is the proper fix.
mailing.service.url=${MAILING_SERVICE_URL:http://localhost:8085}
recaptcha.service.url=${RECAPTCHA_SERVICE_URL:http://localhost:8089}

# ============================================================
# ANTI-BOT: reCAPTCHA
# ============================================================
# ON. Protects only the unauthenticated endpoints a bot can actually profit
# from -- authenticate, two-factor/verify, account creation and password reset.
# Authenticated mutations are not covered on purpose: they already require a
# valid access token, and an attacker holding one is not stopped by a captcha.
#
# Requires the browser to send the token as X-Recaptcha-Token. The Angular app
# does this from its HTTP interceptor; a caller that does not (curl, Postman)
# gets 400 on these routes, which is the intended behaviour.
security.recaptcha.enabled=${RECAPTCHA_ENABLED:true}

# Fail CLOSED when the reCAPTCHA service cannot be reached: reject rather than
# admit. Failing open would turn any outage of that service -- including one an
# attacker triggers -- into a window with no bot protection, which is exactly
# when it matters most. Leave this false.
security.recaptcha.fail-open=false

# Ceiling on the verification round trip. Short on purpose: this runs before
# sign-in, so a slow scorer must not hold the request open. Exceeding it is a
# failure, and therefore a rejection under fail-closed.
security.recaptcha.timeout-ms=3000

# ============================================================
# RATE LIMITING
# ============================================================
security.rate-limit.enabled=true
security.rate-limit.second=10
security.rate-limit.minute=100

# ============================================================
# SERVICE DISCOVERY
# ============================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ============================================================
# DOCS
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
# LOGGING
# ============================================================
logging.level.com.trading.easytradify.auth=INFO

# Useful while wiring the Google handshake; far too chatty otherwise, and it
# prints request details you do not want in a shared log.
logging.level.org.springframework.security=INFO
