spring.application.name=trades-service

# 8094.
#
# Was 8084 (clashes with ai-service), then 8085 -- which turned out to be taken
# too: an unrelated Spring project on this machine runs a mailing-service there
# and registers it with the SAME Eureka. That is the worse kind of clash,
# because the gateway resolves by service name: whichever process binds the port
# first wins, the other dies, and the survivor is whichever one happened to
# start first that day.
#
# 8094 is clear of both projects. Ports held elsewhere: 8080/8088 gateways,
# 8081 collector, 8082 api, 8083 portfolio, 8084 ai, 8085 mailing, 8086
# execution, 8087 monitor, 8089 recaptcha, 8090 ad-module, 8093 auth.
server.port=8094

# ============================================================
# PYTHON TRADES SERVICE
# ============================================================
# api/trades_controller.py -- the REST face of the MongoDB
# easytradify.trades collection. It owns the collection; this
# service must never connect to MongoDB directly, or the unique
# trade_id index, the idempotent upsert and the delete gating
# would all be bypassed by a second writer.
trades.service.url=http://localhost:5011

# Generous, because some endpoints do real work rather than a
# lookup: /diagnostics scans stored trades and /stats/timeseries
# aggregates across the collection. A short read timeout turns a
# slow-but-correct answer into a spurious error.
trades.connect-timeout=30000
trades.read-timeout=60000
trades.write-timeout=60000

# Optional shared secret, sent as X-API-Key when set.
internal.api.key=

# ============================================================
# SERVICE DISCOVERY
# ============================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ============================================================
# DOCS
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
# LOGGING
# ============================================================
logging.level.com.trading.easytradify.trades=INFO
