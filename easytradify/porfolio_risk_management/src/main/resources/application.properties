# ========================
# EXECUTION SERVICE CONFIGURATION
# ========================
spring.application.name=portflio_risk_management-service
server.port=8083

# Internal API Key for service-to-service communication
internal.api.key=easy-tradify-internal-secret-key-2026

# ========================
# DATABASE
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/easytradify-portfolio-service
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Timeouts
python.connect-timeout=30000
python.read-timeout=30000
python.write-timeout=30000

# Retry configuration
python.max-retries=3
python.retry-delay=1000

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ========================
# LOGGING
# ========================
logging.level.com.trading.easytradify.portfolio_risk_management=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG
